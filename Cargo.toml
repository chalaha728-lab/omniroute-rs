[package]
name = "omniroute-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
authors = ["OmniRoute Team <support@omniroute.online>"]
license = "MIT"
description = "Fast, light, OpenAI-compatible AI gateway — Rust rewrite"
homepage = "https://omniroute.online"
repository = "https://github.com/chalaha728-lab/omniroute-rs"
keywords = ["ai", "llm", "gateway", "openai", "proxy"]
categories = ["web-programming", "api-bindings"]

[[bin]]
name = "omniroute"
path = "src/main.rs"

[dependencies]
# Web framework + async runtime
axum = { version = "0.7", features = ["macros", "ws"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs", "compression-gzip"] }

# HTTP client (rustls — no OpenSSL dependency)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
rustls = "0.23"

# Database
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "macros", "migrate", "uuid", "chrono"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

# Auth
jsonwebtoken = "9"
argon2 = "0.5"
rand = "0.8"
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# CLI + config
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"

# Misc
anyhow = "1"
thiserror = "1"
once_cell = "1"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
futures = "0.3"
bytes = "1"
mime = "0.3"

[dev-dependencies]
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true
